<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="AyurVarta — Ancient Ayurvedic Science Meets Groq AI and Polyglot Microservices">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120f" />
      <stop offset="52%" stop-color="#0a1f1a" />
      <stop offset="100%" stop-color="#08141c" />
    </linearGradient>

    <!-- Soft Aura Gradients -->
    <radialGradient id="auraGreen" cx="79%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06120f" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auraGold" cx="22%" cy="32%" r="38%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06120f" stop-opacity="0" />
    </radialGradient>

    <!-- Shimmering Title Gradient -->
    <linearGradient id="titleGrad" x1="-100%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="28%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#fcd34d" />
      <stop offset="72%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#ecfdf5" />
      <animate attributeName="x1" values="-100%;100%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;300%" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.48" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.42" />
    </linearGradient>

    <!-- Pipeline Connector Gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.40" />
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="gridDots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34d399" fill-opacity="0.11" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="356" rx="20" />
    </clipPath>

    <style>
      .sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'Cascadia Code', 'Fira Code', Consolas, 'SFMono-Regular', monospace;
      }
    </style>
  </defs>

  <!-- Main Rounded Frame -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="1200" height="360" fill="url(#gridDots)" />
    <rect x="0" y="0" width="1200" height="360" fill="url(#auraGreen)" />
    <rect x="0" y="0" width="1200" height="360" fill="url(#auraGold)" />

    <!-- Subtle Decorative Background Arcs -->
    <circle cx="960" cy="180" r="220" fill="none" stroke="#10b981" stroke-opacity="0.06" stroke-width="1" />
    <circle cx="960" cy="180" r="290" fill="none" stroke="#fbbf24" stroke-opacity="0.04" stroke-width="1" />

    <!-- TOP STATUS PILL -->
    <g>
      <rect x="64" y="42" width="356" height="34" rx="17" fill="#0d2b22" stroke="#34d399" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="83" cy="59" r="5" fill="#34d399" filter="url(#softGlow)">
        <animate attributeName="r" values="4.2;5.8;4.2" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="99" y="63" class="mono" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#a7f3d0">
        SIH 2025 · CLINICAL AYURVEDIC RAG
      </text>
    </g>

    <!-- MAIN TITLE -->
    <text x="64" y="142" class="sans" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#titleGrad)">
      AyurVarta
    </text>

    <!-- ANIMATED ROTATING SUBTITLE TAGLINES -->
    <g font-size="18.5" font-weight="500" class="sans" fill="#cbd5e1">
      <text x="66" y="184" opacity="1">
        Ancient <tspan fill="#6ee7b7" font-weight="700">Tridosha &amp; Agni</tspan> Diagnostics × <tspan fill="#fcd34d" font-weight="700">Groq LPU</tspan> Clinical AI
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.34;0.94;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="66" y="184" opacity="0">
        <tspan fill="#38bdf8" font-weight="700">Polyglot Persistence</tspan> across MongoDB, Pinecone Vectors &amp; Redis
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.37;0.61;0.67;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="66" y="184" opacity="0">
        Clinically Guarded with <tspan fill="#fbbf24" font-weight="700">Charaka's 18 Viruddha Ahara</tspan> Safety Rules
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.70;0.93;1" dur="9s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- ANIMATED PIPELINE STRIP (BOTTOM LEFT) -->
    <g>
      <!-- Connector Line + Traveling Light Pulses -->
      <line x1="175" y1="274" x2="640" y2="274" stroke="url(#pipeGrad)" stroke-width="2" stroke-dasharray="5 5">
        <animate attributeName="stroke-dashoffset" values="20;0" dur="1.4s" repeatCount="indefinite" />
      </line>

      <circle r="3.8" fill="#6ee7b7" filter="url(#softGlow)">
        <animateMotion dur="2.8s" repeatCount="indefinite" path="M160,274 L650,274" />
      </circle>
      <circle r="3.2" fill="#fcd34d" filter="url(#softGlow)">
        <animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M160,274 L650,274" />
      </circle>

      <!-- Node 1: Diagnostics -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.5s" repeatCount="indefinite" />
        <rect x="64" y="242" width="174" height="64" rx="12" fill="#0b221c" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.2" />
        <text x="80" y="266" class="mono" font-size="10.5" font-weight="700" fill="#34d399" letter-spacing="0.8">01 · DIAGNOSE</text>
        <text x="80" y="288" class="sans" font-size="13.5" font-weight="600" fill="#f1f5f9">Prakriti · Vikriti · Agni</text>
      </g>

      <!-- Node 2: Groq + Vector RAG -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.5s" begin="0.8s" repeatCount="indefinite" />
        <rect x="268" y="242" width="186" height="64" rx="12" fill="#101f29" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2" />
        <text x="284" y="266" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="0.8">02 · RETRIEVE &amp; AI</text>
        <text x="284" y="288" class="sans" font-size="13.5" font-weight="600" fill="#f1f5f9">Pinecone + Groq 70B</text>
      </g>

      <!-- Node 3: Guardrails -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4.5s" begin="1.6s" repeatCount="indefinite" />
        <rect x="484" y="242" width="186" height="64" rx="12" fill="#211b0e" stroke="#fbbf24" stroke-opacity="0.48" stroke-width="1.2" />
        <text x="500" y="266" class="mono" font-size="10.5" font-weight="700" fill="#fbbf24" letter-spacing="0.8">03 · GUARDRAIL ✓</text>
        <text x="500" y="288" class="sans" font-size="13.5" font-weight="600" fill="#f1f5f9">18 Viruddha Verified</text>
      </g>
    </g>

    <!-- RIGHT SIDE: ANIMATED TRIDOSHA + POLYGLOT ORBITAL MANDALA -->
    <g>
      <!-- Outer Dashed Orbit Track -->
      <circle cx="960" cy="180" r="126" fill="none" stroke="#34d399" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="6 6" />
      <!-- Middle Orbit Track -->
      <circle cx="960" cy="180" r="84" fill="none" stroke="#fbbf24" stroke-opacity="0.28" stroke-width="1.2" />

      <!-- Rotating Outer Polyglot DB Orbit (Mongo, Vector, Redis) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 960 180" to="360 960 180" dur="36s" repeatCount="indefinite" />
        <!-- MongoDB Node (Top) -->
        <g transform="translate(960, 54)">
          <circle r="16" fill="#082419" stroke="#4ade80" stroke-width="1.5" filter="url(#softGlow)" />
          <text x="0" y="4" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#86efac">
            MDB
            <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite" />
          </text>
        </g>
        <!-- Pinecone Vector Node (Bottom Right) -->
        <g transform="translate(1069, 243)">
          <circle r="16" fill="#09212e" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
          <text x="0" y="4" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#7dd3fc">
            VEC
            <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite" />
          </text>
        </g>
        <!-- Redis Node (Bottom Left) -->
        <g transform="translate(851, 243)">
          <circle r="16" fill="#291216" stroke="#fb7185" stroke-width="1.5" filter="url(#softGlow)" />
          <text x="0" y="4" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#fda4af">
            RDS
            <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="36s" repeatCount="indefinite" />
          </text>
        </g>
      </g>

      <!-- Counter-Rotating Middle Tridosha Triad (Vata, Pitta, Kapha) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360 960 180" to="0 960 180" dur="22s" repeatCount="indefinite" />
        <circle cx="960" cy="96" r="7" fill="#38bdf8" filter="url(#softGlow)" />
        <circle cx="1032.7" cy="222" r="7" fill="#fbbf24" filter="url(#softGlow)" />
        <circle cx="887.3" cy="222" r="7" fill="#34d399" filter="url(#softGlow)" />
      </g>

      <!-- Breathing Center Lotus / Leaf Core -->
      <g transform="translate(960, 180)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;1.06;1" dur="4s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="46" fill="#0b2820" stroke="#34d399" stroke-opacity="0.65" stroke-width="1.8" />
          <circle cx="0" cy="0" r="36" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 3" />

          <!-- Minimal Sacred Botanical Leaf Geometry -->
          <path d="M0,-30 C12,-17 15,0 0,24 C-15,0 -12,-17 0,-30 Z" fill="#34d399" fill-opacity="0.92" />
          <path d="M0,-16 C17,-12 26,2 8,22 C1,11 0,-2 0,-16 Z" fill="#6ee7b7" fill-opacity="0.55" />
          <path d="M0,-16 C-17,-12 -26,2 -8,22 C-1,11 0,-2 0,-16 Z" fill="#fbbf24" fill-opacity="0.50" />
          <line x1="0" y1="-22" x2="0" y2="26" stroke="#06120f" stroke-width="1.6" stroke-linecap="round" />
        </g>
      </g>

      <!-- Subtle Legend -->
      <text x="960" y="332" text-anchor="middle" class="mono" font-size="10.5" letter-spacing="1.4" fill="#64748b">
        TRIDOSHA CORE · POLYGLOT RING
      </text>
    </g>
  </g>

  <!-- Outer Crisp Frame Border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
